name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="auto-porter-${{ github.ref_name }}-${{ matrix.target }}"
          # The release must never ship an empty archive (spec §9: no silent
          # failures) — fail loudly if the binary is missing instead of
          # swallowing the cp error. Windows builds `auto-porter.exe`.
          bin="target/${{ matrix.target }}/release/auto-porter"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          [ -f "$bin" ] || { echo "release binary not found: $bin" >&2; exit 1; }
          mkdir "$name"
          cp "$bin" "$name"/
          if [ "${{ matrix.ext }}" = "zip" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          # Do not let the staging directory match the upload glob below.
          rm -r "$name"
          ls -l "$name".*
      - uses: softprops/action-gh-release@v2
        with:
          # Archive names are auto-porter-v<tag>-<target>; `auto-porter-*`
          # would also match repo-root files like auto-porter-prompt.md.
          files: auto-porter-v*
          generate_release_notes: true
