name: In-Game Dispatch

# §5.2's last mile: boot the staged `horizon-native-game` — the real game with
# the ported mod wired in — on a GitHub-hosted runner, and watch the game's
# own tick loop dispatch the mod's `player_tick` hook. No Minecraft account
# anywhere: the game starts with no session ("the game still starts" —
# Horizon's launch guide §6), headless (`--offscreen` under Xvfb, the
# launcher's no-ALSA engine target), and the resources `horizon-prepare`
# needs come from Mojang's public distribution endpoints — the same files a
# signed-in launcher would hand it, each verified against research-lock.json's
# sha1 pins by `scripts/fetch_mojang_inputs.py` and again by the preparer.
#
# Two seeds, one pipeline:
# - `mock`: the port is produced hermetically by the mock LLM serving a
#   hand-written body shaped like the model's accepted output — a body that
#   calls the Host, so a live dispatch is observable from outside. The job
#   fails unless the broadcast markers appear in the server's log.
# - `real`: the port is produced by the real NVIDIA NIM generation (the
#   production path). The body is whatever the model wrote; the observable is
#   extracted from the emitted code (`scripts/in_game_markers.py`): broadcast
#   literals are log-observable and must appear in the server's log; a body
#   that only `tell`s is player-chat-private (nothing lands in the log) and
#   the job says so, relying on the compile gate's dispatch smoke and the
#   state-poll assertions for the dispatch half of the evidence.
#
# Both legs assert the game kept simulating: two `horizon-ctl state` polls
# ~20s apart must show the client tick counter advancing (the real tick loop
# with the mod live) and a player in an open world.
#
# Honesty rules (same as the compile gate): every step runs for real; a
# failure anywhere fails the job; no step is allowed to pass vacuously.

on:
  pull_request: { branches: [main] }
  push:         { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Workflow-level env CAN read secrets (job-level `if` cannot), so this
  # gates the `real` leg without duplicating a secret into any log.
  HAS_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY != '' }}

jobs:
  in-game-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        seed: [mock, real]
    # The `real` leg needs the NVIDIA secret. GitHub's expression rules make
    # the gate STEP-level, not job-level: `env` is not available in a
    # job-level `if` (and `secrets` in no `if` at all — a workflow file that
    # tries is rejected at parse time with zero jobs). Every leg-specific
    # step and every shared pipeline step below carries the condition; a
    # no-key run leaves the real leg visibly skipped (an explicit notice
    # step), and the mock leg always runs.
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the Horizon build cache is multi-GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Pinned revisions
        id: pins
        run: |
          REV=$(python3 -c "import tomllib;print(tomllib.load(open('porter.toml','rb'))['horizon']['revision'])")
          MIX=$(python3 -c "import tomllib;print(tomllib.load(open('porter.toml','rb'))['horizon']['mixins_revision'])")
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "mixins=$MIX" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned Horizon source archive
        uses: actions/cache@v4
        with:
          path: /tmp/auto-porter-horizon-source
          key: horizon-source-${{ steps.pins.outputs.revision }}

      - name: Cache the game's cargo target dir (shared with Bundle Compile)
        uses: actions/cache@v4
        with:
          path: gate-target
          key: horizon-gate-target-${{ steps.pins.outputs.revision }}-${{ github.sha }}
          restore-keys: |
            horizon-gate-target-${{ steps.pins.outputs.revision }}-

      - name: Cache horizon-mixins (built from source)
        uses: actions/cache@v4
        with:
          path: .gate-tools
          key: horizon-mixins-${{ steps.pins.outputs.mixins }}

      - name: Install horizon-mixins at the pinned revision
        run: |
          ROOT=".gate-tools/${{ steps.pins.outputs.mixins }}"
          if [ ! -x "$ROOT/bin/horizon-mixins" ]; then
            cargo install --locked --root "$ROOT" \
              --git https://github.com/horizon-rust/horizon-mixins \
              --rev "${{ steps.pins.outputs.mixins }}" horizon-mixins-cli
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Build auto-porter
        run: cargo build --locked --release -p cli

      - name: Port the fixture hermetically (mock LLM, dispatch-marker body)
        if: matrix.seed == 'mock'
        working-directory: ${{ github.workspace }}
        run: |
          GATE=$(mktemp -d)
          PORT=$((20000 + RANDOM % 20000))
          # A real implementation, as the LLM writes for this fixture: the
          # body uses the Host, so a live dispatch is observable from outside.
          cat > "$GATE/response.rs" <<'EOF'
          use horizon_client::mod_api::*;
          use std::sync::atomic::{AtomicU32, Ordering};

          #[derive(Default)]
          pub struct ChunkcourierTick;

          impl horizon_client::mod_api::Hooks for ChunkcourierTick {
              /// ported tick hook: announces its own dispatch on the Host.
              fn player_tick(&self, host: &mut dyn Host, _event: &mut PlayerTickEvent) {
                  static TICKS: AtomicU32 = AtomicU32::new(0);
                  let tick = TICKS.fetch_add(1, Ordering::Relaxed);
                  if tick % 100 == 0 {
                      host.broadcast(format!(
                          "[chunkcourier] player_tick dispatched (in-game tick #{tick})"
                      ).into());
                  }
              }
          }
          EOF
          sed -e "s|^# base_url.*|base_url   = \"http://127.0.0.1:$PORT/v1/chat/completions\"|" \
            porter.toml > "$GATE/porter.toml"
          python3 scripts/mock_llm_server.py good 0 "$GATE/counter" "$PORT" "$GATE/response.rs" &
          MOCK=$!
          sleep 1
          NVIDIA_API_KEY=mock-key \
            ./target/release/auto-porter port tests/fixtures/jars/chunkcourier-neoforge-2.0.0.jar \
              --config "$GATE/porter.toml" --output "$GATE/out"
          RC=$?
          kill "$MOCK" 2>/dev/null || true
          test "$RC" -eq 0
          test -f "$GATE/out/chunkcourier.hnmod"
          echo "GATE_DIR=$GATE" >> "$GITHUB_ENV"

      - name: Port the fixture with the real NVIDIA NIM model (the production path)
        if: matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true'
        timeout-minutes: 25
        working-directory: ${{ github.workspace }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          GATE=$(mktemp -d)
          # The repo's porter.toml is already the real-NIM config (provider
          # nvidia, model pinned, base_url commented). Copy it where the
          # shared verify step expects the config. Same fixture and --source
          # as the port-test LLM smoke; every request/response pair is traced
          # and the trace goes to the workspace at once, so it uploads even
          # if a later assert fails (autopsy evidence).
          cp porter.toml "$GATE/porter.toml"
          set +e
          AUTO_PORTER_LLM_TRACE="$GATE/llm-trace.jsonl" \
            ./target/release/auto-porter port tests/fixtures/jars/chunkcourier-neoforge-2.0.0.jar \
              --config "$GATE/porter.toml" \
              --llm-provider nvidia --llm-model minimaxai/minimax-m3.1-flash \
              --source tests/fixtures/sources/chunkcourier \
              --output "$GATE/out"
          RC=$?
          set -e
          cp "$GATE/llm-trace.jsonl" llm-trace.jsonl 2>/dev/null || true
          test "$RC" -eq 0
          test -f "$GATE/out/chunkcourier.hnmod"
          # The tick feature must really be ported: an honest PORT_INFEASIBLE
          # or a repair-less failure fails the leg here, before any boot.
          python3 - "$GATE/out/chunkcourier-report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          tick = [f for f in r["features"] if "playertickevent" in f["feature_id"]]
          assert tick, "tick feature missing from report"
          print("tick feature status:", tick[0]["status"])
          if tick[0]["status"] != "ported":
              for e in r["errors"]:
                  if "tickevent" in e.get("feature", ""):
                      print("LLM error:", e.get("error_type"), "|", str(e.get("message"))[:300])
              sys.exit("the real NIM run did not port the tick feature")
          PY
          echo "GATE_DIR=$GATE" >> "$GITHUB_ENV"

      - name: Notice the skipped real leg (no NVIDIA key)
        if: matrix.seed == 'real' && env.HAS_NVIDIA_KEY != 'true'
        run: |
          echo "the real leg does not run: secrets.NVIDIA_API_KEY is not set."
          echo "the boot pipeline below stays skipped for this leg (no port to"
          echo "boot), which leaves the mock leg's evidence untouched."

      - name: Stage and build the game (launcher-style pipeline, keep the tree)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        env:
          AUTO_PORTER_GATE_BUILD: "1"
          AUTO_PORTER_GATE_WORK: ${{ github.workspace }}/gate-work
          AUTO_PORTER_GATE_KEEP: "1"
          AUTO_PORTER_GATE_TARGET: ${{ github.workspace }}/gate-target
        run: |
          set -o pipefail
          ./target/release/auto-porter verify "$GATE_DIR/out" --compile \
            --config "$GATE_DIR/porter.toml" --verbose 2>&1 | tee gate.log
          cp "$GATE_DIR/out/chunkcourier-verification.json" .
          python3 - <<'EOF'
          import json, os, sys
          out = os.path.join(os.environ["GATE_DIR"], "out")
          compile = json.load(open(os.path.join(out, "chunkcourier-verification.json")))["compile"]
          print("compile:", compile["status"], "-", compile.get("reason", ""))
          if compile["status"] != "pass":
              sys.exit(f"compile gate did not pass: {compile['status']}")
          EOF
          # The staged package is horizon-native-game but its BIN is named
          # horizon-client — the launcher's convention, so the launcher can
          # start it as the client (verify/src/compile.rs stage_api_crate).
          test -x gate-target/fast/horizon-client

      - name: A JDK for the preparer's exporters (the pin wants Java 25)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Fetch the pinned Minecraft files from Mojang's public endpoints
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        run: |
          LOCK="/tmp/auto-porter-horizon-source/${{ steps.pins.outputs.revision }}/research-lock.json"
          python3 scripts/fetch_mojang_inputs.py --lock "$LOCK" --out /tmp/mojang --jobs 12
          du -sh /tmp/mojang

      - name: Build horizon-prepare at the pin (its own target dir)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        working-directory: ${{ github.workspace }}/gate-work
        run: |
          # Copy out of the cache: the preparer writes exporters' scratch into
          # the root's .local/, which must not pollute the cached archive.
          cp -a "/tmp/auto-porter-horizon-source/${{ steps.pins.outputs.revision }}" horizon
          cd horizon
          cargo build --locked --release -p horizon-prepare \
            --target-dir "$RUNNER_TEMP/horizon-prep-target"

      - name: Prepare the resources offline (no account, no launcher)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        run: |
          PREP="$RUNNER_TEMP/horizon-prep-target/release/horizon-prepare"
          ROOT="$PWD/gate-work/horizon"
          "$PREP" --prepare --root "$ROOT" \
            --version-json /tmp/mojang/version.json \
            --client-jar /tmp/mojang/client.jar \
            --libraries-dir /tmp/mojang/libraries \
            --server-jar /tmp/mojang/server.jar \
            --output "$PWD/resources" --progress json 2>prepare.stderr | tee prepare.jsonl
          tail -5 prepare.stderr || true

      - name: Check the prepared resources (only the optional extras may lack)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        run: |
          PREP="$RUNNER_TEMP/horizon-prep-target/release/horizon-prepare"
          ROOT="$PWD/gate-work/horizon"
          set +e
          "$PREP" --check --root "$ROOT" --output "$PWD/resources" > check.txt
          RC=$?
          set -e
          cat check.txt
          [ "$RC" -le 1 ] || exit 1
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *"horizon-prepare packs"|*"horizon-prepare panorama"|*"horizon-prepare fonts"|*"horizon-prepare languages"|*"horizon-prepare sounds") ;;
              *) echo "unexpected resource gap: $line"; exit 1 ;;
            esac
          done < check.txt

      - name: Extract the real port's in-game observables
        if: matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true'
        run: |
          python3 scripts/in_game_markers.py "$GATE_DIR/out" \
            --markers markers.txt --json markers.json

      - name: Build horizon-ctl in the staged tree
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        working-directory: ${{ github.workspace }}/gate-work/stage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/gate-target
        # horizon-ctl is the bin target of the horizon-client-lib package.
        run: cargo build --locked --profile fast --no-default-features -p horizon-client-lib --bin horizon-ctl

      - name: Boot the game headless (Xvfb, --offscreen, no session)
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libglx-mesa0 mesa-vulkan-drivers \
            libxkbcommon-x11-0 libxkbcommon0
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          CTL="$PWD/gate-target/fast/horizon-ctl"
          GAME="$PWD/gate-target/fast/horizon-client"
          mkdir -p instance
          "$CTL" --socket "$PWD/game.sock" launch --game "$GAME" \
            --resources "$PWD/resources" \
            --offscreen --game-dir "$PWD/instance" --home "$PWD/instance" | tee launch.json
          "$CTL" --socket "$PWD/game.sock" open dispatch-world 20261106 creative
          "$CTL" --socket "$PWD/game.sock" wait-ready 400 | tee ready.json
          echo "game is in-world; watching the ticks run"
          "$CTL" --socket "$PWD/game.sock" state | tee state-0.json
          sleep 20
          "$CTL" --socket "$PWD/game.sock" state | tee state-1.json
          sleep 10
          "$CTL" --socket "$PWD/game.sock" state | tee state-2.json || true
          "$CTL" --socket "$PWD/game.sock" quit || true
          sleep 2

      - name: Assert the hook dispatched and the game kept simulating
        if: matrix.seed == 'mock' || (matrix.seed == 'real' && env.HAS_NVIDIA_KEY == 'true')
        run: |
          LOG="$PWD/instance/logs/latest.log"
          test -f "$LOG" || { echo "the game wrote no log"; exit 1; }
          # The game must have kept simulating with the mod live: the client
          # tick counter advances 20/s (300 over the 20s window; margin for
          # scheduler noise), in an open world, with a player in it.
          python3 - <<'PY'
          import json, sys

          def read_state(path):
              text = open(path).read()
              start, end = text.find("{"), text.rfind("}")
              if start < 0 or end <= start:
                  sys.exit(f"no JSON object in {path}")
              return json.loads(text[start : end + 1])

          s0 = read_state("state-0.json")
          s1 = read_state("state-1.json")
          for name, s in (("poll 0", s0), ("poll 1", s1)):
              assert s.get("world"), f"{name}: no world open"
              assert s.get("player"), f"{name}: no player in the world"
              print(f"{name}: ticks={s['ticks']} world={s['world']!r} "
                    f"dim={s.get('dimension')!r} mode={s.get('gamemode')!r}")
          delta = s1["ticks"] - s0["ticks"]
          print(f"ticks advanced: {delta} over the 20s window")
          assert delta >= 300, f"the tick loop stalled: only {delta} ticks in 20s"
          print("the game kept simulating with the ported mod live")
          PY
          echo "--- dispatch markers in the server log ---"
          if [ "${{ matrix.seed }}" = "mock" ]; then
            grep 'player_tick dispatched' "$LOG" | head -8 || true
            MATCHES=$(grep -c 'player_tick dispatched' "$LOG" || true)
            echo "dispatch markers: $MATCHES"
            [ "$MATCHES" -ge 3 ] || {
              echo "the mod's player_tick never fired in the booted game"
              tail -40 "$LOG"
              exit 1
            }
          else
            # The real port's body is whatever the model wrote. Broadcast
            # markers are log-observable and must appear; a tell-only body is
            # player-chat-private, and its dispatch evidence is the compile
            # gate's dispatch smoke plus the state-poll assertions above.
            if [ -s markers.txt ]; then
              echo "expected broadcast markers (from the emitted code):"
              cat markers.txt
              MATCHES=0
              while IFS= read -r marker; do
                [ -n "$marker" ] || continue
                C=$(grep -cF -- "$marker" "$LOG" || true)
                echo "  $C x $marker"
                MATCHES=$((MATCHES + C))
              done < markers.txt
              echo "dispatch markers: $MATCHES"
              [ "$MATCHES" -ge 3 ] || {
                echo "the emitted broadcast markers never appeared in the server's log"
                tail -40 "$LOG"
                exit 1
              }
            else
              echo "the real port's body carries no broadcast: its messages are"
              echo "tell-only (player chat HUD, which the server's log does not"
              echo "carry). The dispatch half of the evidence stays with the"
              echo "compile gate's dispatch smoke (same emitted code, the pinned"
              echo "build's real dispatch machinery) and the state-poll ticks"
              echo "asserted above; the log cannot show this body's effect."
            fi
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-game-dispatch-evidence-${{ matrix.seed }}
          path: |
            gate.log
            chunkcourier-verification.json
            prepare.jsonl
            prepare.stderr
            check.txt
            launch.json
            ready.json
            state-0.json
            state-1.json
            state-2.json
            markers.json
            markers.txt
            llm-trace.jsonl
            instance/logs/latest.log
            game.sock.log
          if-no-files-found: warn
