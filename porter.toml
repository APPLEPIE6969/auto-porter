# auto-porter configuration (spec §11, plus the local additions documented in docs/limitations.md)

[horizon]
revision        = "6beacfe91a0074a783261d10383b7c8a77cb4cd1"   # horizon-rust/horizon main, 2026-11-02
mixins_revision = "ddd9700b21997c95d95ac6ee5ecafe3830cf622a"   # horizon-rust/horizon-mixins main, 2026-11-01
hooks_api       = 359                                          # NATIVE_HOOKS_API at that revision (crates/horizon-client/src/game/native_hooks.rs); the build fails if it differs
hooks_json      = "hooks/native-hooks.json"                    # committed snapshot of native-hooks.json at the pinned revision
client_path     = "~/.horizon/horizon-client"
ctl_path        = "~/.horizon/horizon-ctl"
port_pack_path  = "~/.cargo/bin/horizon-port-pack"

[llm]
provider     = "nvidia"                       # "anthropic", "openai"
model        = "minimaxai/minimax-m3.1-flash"  # NVIDIA NIM reasoning model
max_retries  = 3                               # nvidia always uses the documented ceiling: 100 attempts/request
retry_delay_ms = 1000                          # pause between attempts (rate-limit polls)
timeout_secs = 180   # deep reasoning (effort=high) needs headroom: 60s timed out 3/4 attempts in CI
temperature  = 0.1
reasoning_effort = "high"                      # max documented reasoning effort (NVIDIA NIM)
# base_url   = "http://127.0.0.1:8000/v1/chat/completions"   # self-hosted NIM / gateway override

[parity]
java_server_dir = "tests/parity/java-oracle/"  # filled by fetch_server.py; never committed
scenario_timeout_secs = 30
shards = 4

[in_game]
ssim_threshold = 0.95
ssim_advisory  = true
golden_dir     = "tests/in-game/golden/"
virtual_display = true

[output]
dir = "./output/"
include_tests  = true
include_report = true
