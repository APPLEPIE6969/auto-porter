# auto-porter configuration (spec §11, plus the local additions documented in docs/limitations.md)

[horizon]
revision        = "0000000000000000000000000000000000000000"   # PLACEHOLDER: replace with the full 40-hex Horizon commit you pin
mixins_revision = "0000000000000000000000000000000000000000"   # PLACEHOLDER: full 40-hex horizon-mixins commit at that revision
hooks_api       = 2                                            # set from NATIVE_HOOKS_API at the pinned revision; the build fails if it differs
hooks_json      = "hooks/native-hooks.seed.json"               # replace with native-hooks.json from the pinned Horizon revision
client_path     = "~/.horizon/horizon-client"
ctl_path        = "~/.horizon/horizon-ctl"
port_pack_path  = "~/.cargo/bin/horizon-port-pack"

[llm]
provider     = "openrouter"                    # "anthropic", "openai", "nvidia"
                                               # NOTE: OpenRouter gates `thinkingmachines/inkling-small:free`
                                               # behind registered "agentic harnesses" (HTTP 403) — for a
                                               # working free path use:  --llm-provider nvidia
model        = "thinkingmachines/inkling-small:free"   # nvidia example: "minimaxai/minimax-m3.1-flash"
max_retries  = 3                               # nvidia always uses the documented ceiling: 100 attempts/request
retry_delay_ms = 1000                          # pause between attempts (rate-limit polls)
timeout_secs = 180   # deep reasoning (effort=high) needs headroom: 60s timed out 3/4 attempts in CI
temperature  = 0.1
reasoning_effort = "high"                      # max documented reasoning effort (NVIDIA NIM)
# base_url   = "http://127.0.0.1:8000/v1/chat/completions"   # self-hosted NIM / gateway override

[parity]
java_server_dir = "tests/parity/java-oracle/"  # filled by fetch_server.py; never committed
scenario_timeout_secs = 30
shards = 4

[in_game]
ssim_threshold = 0.95
ssim_advisory  = true
golden_dir     = "tests/in-game/golden/"
virtual_display = true

[output]
dir = "./output/"
include_tests  = true
include_report = true
